[data-t=mint][data-d="0"]{--bg:#E8FFF2;--card:#fff;--ink:#0D2B22;--mut:#4d6b60;--acc:#075E46;--on:#E8FFF2;--hl:#cdf3de;--ln:#b6dcc8}
[data-t=mint][data-d="1"]{--bg:#04120D;--card:#0b2219;--ink:#E8FFF2;--mut:#93b8a8;--acc:#8FE3BC;--on:#04120D;--hl:#12372a;--ln:#1d4a39}
[data-t=berry][data-d="0"]{--bg:#E0F2FE;--card:#fff;--ink:#1a1a24;--mut:#546273;--acc:#C2185B;--on:#fff;--hl:#c7e5f8;--ln:#b0d4ec}
[data-t=berry][data-d="1"]{--bg:#0b1620;--card:#13222f;--ink:#E0F2FE;--mut:#9ab4c8;--acc:#F06292;--on:#0b1620;--hl:#1c3346;--ln:#27465e}
[data-t=violet][data-d="0"]{--bg:#F1E6FF;--card:#fff;--ink:#0D0D0D;--mut:#5d5368;--acc:#0D0D0D;--on:#D9B8FF;--hl:#D9B8FF;--ln:#cdb0f2}
[data-t=violet][data-d="1"]{--bg:#0D0D0D;--card:#1a1a1a;--ink:#f2e9ff;--mut:#b3a6c4;--acc:#D9B8FF;--on:#0D0D0D;--hl:#2a2236;--ln:#3a3048}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
:root{--r:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:10px 14px;min-height:44px}
button.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px;min-height:44px;width:100%}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:20px 12px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:6px}
nav h1{margin:0 8px 14px;color:var(--acc)}
nav button{text-align:left;border:0;background:none}nav button.on{background:var(--acc);color:var(--on)}
main{padding:20px;max-width:900px;width:100%;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:.85rem}h2{margin:4px 0 10px}
.bar{height:10px;border-radius:9px;background:var(--hl);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;border:1px solid transparent;margin-bottom:4px}
.it.now{border-color:var(--acc);background:var(--hl)}.it.done b{text-decoration:line-through;opacity:.6}
.it input[type=checkbox]{width:24px;height:24px;min-height:0;margin-top:2px;accent-color:var(--acc)}
.tm{font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--acc)}
.dots{display:flex;gap:10px}.dot{width:44px;height:44px;border-radius:50%;padding:0}.dot.on{outline:3px solid var(--ink);outline-offset:3px}
.sw{width:52px;height:30px;padding:3px;min-height:0;border-radius:99px;background:var(--hl)}.sw i{display:block;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}.sw.on{background:var(--acc)}.sw.on i{transform:translateX(22px);background:var(--on)}
dialog{border:1px solid var(--ln);border-radius:var(--r);background:var(--card);color:var(--ink);width:min(420px,92vw)}dialog::backdrop{background:#0008}
dialog label{display:block;margin:8px 0 2px;font-size:.85rem}
@media(max-width:720px){#app{display:block;padding-bottom:76px}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));background:var(--card);border:0;border-top:1px solid var(--ln);z-index:5}nav h1{display:none}nav button{flex:1;text-align:center;padding:8px 2px;font-size:.78rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#app{min-height:calc(100vh - 72px)}
#top{position:sticky;top:0;z-index:8;height:72px;display:flex;align-items:center;gap:12px;padding:0 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.lg{width:52px;height:52px;border-radius:18px;background:#fffdf8;display:grid;place-items:center;box-shadow:0 6px 18px -8px var(--acc);animation:pop .8s cubic-bezier(.2,1.4,.3,1) both,fl 4.5s ease-in-out .8s infinite}
.lg img{width:40px;height:40px;object-fit:contain}
.lg:hover{transform:rotate(-8deg) scale(1.08)}
.brand{display:flex;line-height:1}.brand i{font-style:normal;display:inline-block;font-size:2rem;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,var(--acc),#E86AA6,var(--acc));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite,bob 2.4s ease-in-out infinite;animation-delay:0s,calc(var(--i)*.18s)}
.tag{font-size:.7rem;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-left:2px}
.hang{position:absolute;right:22px;top:0;width:54px;height:96px;pointer-events:none;transform-origin:50% 0;animation:sw 3.2s ease-in-out infinite}
.hang .ey{transform-origin:center;transform-box:fill-box;animation:bl 4s infinite}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-30deg)}}
@keyframes fl{50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes sw{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes ring{from{stroke-dashoffset:327}}
@keyframes wv{to{transform:translateX(-40px)}}
@keyframes grow{from{transform:scaleY(0)}}
.card{animation:up .5s both}.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
button{transition:transform .15s,background .2s}button:active{transform:scale(.94)}
nav{top:72px;height:calc(100vh - 72px)}
nav button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:16px;padding:12px 14px;color:var(--mut);font-weight:600}
nav button.on{background:var(--acc);color:var(--on)}nav svg{flex:none}
.sc{background:linear-gradient(150deg,var(--card),var(--hl))}.big{font-size:3rem;font-weight:800;line-height:1.1;color:var(--acc);font-variant-numeric:tabular-nums}
.wk{display:flex;gap:8px;align-items:flex-end;height:54px;margin:12px 0}.wk div{flex:1;text-align:center;font-size:.7rem;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.wk i{display:block;border-radius:8px;background:var(--acc);opacity:.35;margin-bottom:3px;transform-origin:bottom;animation:grow .7s both}.wk .t i{opacity:1}
.wv{animation:wv 2s linear infinite}.wc{display:flex;gap:14px;align-items:center}
@media(max-width:720px){#top{padding:0 14px}.brand i{font-size:1.7rem}.tag{display:none}#app{padding-bottom:100px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0));top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:8px;border-radius:28px;border:1px solid var(--ln);background:var(--card);box-shadow:0 14px 40px -12px #0006}
nav button{flex:none;padding:12px;font-size:.85rem;gap:0}nav .lb{max-width:0;overflow:hidden;opacity:0;white-space:nowrap;transition:max-width .35s,opacity .3s,margin .3s}nav button.on{gap:8px}nav button.on .lb{max-width:90px;opacity:1}}

.it{border-left:3px solid var(--ln)}.it.now{border-left-color:var(--acc);box-shadow:0 10px 26px -16px var(--acc)}
.bowi{display:inline-block;margin-left:6px;vertical-align:middle;animation:bowp .6s cubic-bezier(.3,1.6,.5,1)}@keyframes bowp{from{transform:scale(0) rotate(-50deg)}}.bow{display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.wd{text-align:center;color:var(--mut);font-size:.8rem}
.cd{aspect-ratio:1;min-height:0;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;border-radius:calc(var(--rb) + 4px);background:var(--hl);font-weight:700;animation:pop2 .4s both;animation-delay:calc(var(--d)*14ms)}
.l1{background:color-mix(in srgb,var(--acc) 22%,var(--card))}.l2{background:color-mix(in srgb,var(--acc) 40%,var(--card))}.l3{background:color-mix(in srgb,var(--acc) 62%,var(--card))}.l4{background:var(--acc);color:var(--on)}
.td{outline:3px solid var(--acc);outline-offset:2px}.sel{box-shadow:0 0 0 3px var(--a2)}.cd small{font-size:.6rem;opacity:.8}.cd u{position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--a2)}.cb{position:absolute;top:2px;right:2px}
@keyframes pop2{from{transform:scale(.5);opacity:0}}.lg2{margin-top:12px;font-size:.8rem;gap:6px}.lg2 .mut{flex-basis:100%;display:flex;gap:6px;align-items:center}.sw0{display:inline-block;width:16px;height:16px;border-radius:5px}
#ts{overflow:visible}#ts::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--web) right/auto 150% no-repeat;opacity:.18;pointer-events:none}
.tsp{position:absolute;top:-4px;right:18px;font-style:normal;font-size:18px;transform-origin:top;animation:sw 1.6s ease-in-out infinite}.tsp::before{content:'';position:absolute;left:50%;bottom:90%;width:1px;height:16px;background:var(--ink)}
@media(max-width:720px){.bell{margin-right:0}.pair{gap:10px}.sc2{max-width:80px;height:84px}}

.lg{width:auto;height:66px;padding:3px 14px;border-radius:18px}.lg img{width:auto;height:58px}
.navset{margin-top:auto}@media(max-width:720px){.navset{display:none}}
.fh{display:flex;gap:10px;align-items:center;justify-content:space-between}.fh>div:first-child{flex:1;min-width:0}
.fb{width:132px;height:auto;flex:none;overflow:visible;animation:up .6s both}
.aL{transform-origin:58px 72px;animation:pL 1.5s ease-in-out infinite alternate}.aR{transform-origin:92px 72px;animation:pR 1.5s ease-in-out infinite alternate}.fast .aL,.fast .aR{animation-duration:.6s}
@keyframes pL{to{transform:rotate(140deg)}}@keyframes pR{to{transform:rotate(-140deg)}}
.br{transform-origin:75px 100px;animation:br 3.6s ease-in-out infinite}@keyframes br{50%{transform:scale(1.04)}}
.hrt{fill:var(--acc);font-size:14px;animation:hrt 3s ease-out infinite}@keyframes hrt{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-22px);opacity:0}}.spk{fill:var(--a2);font-size:14px;animation:tw 1.6s infinite}
.wkS{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wsd{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:78px;padding:6px 0;animation:pop2 .4s both}.wsd.on{background:var(--acc);color:var(--on);border-color:var(--acc)}.wsd.tdy{outline:2px dashed var(--acc);outline-offset:2px}.wsd small{font-size:.65rem;opacity:.8}.wsd span{font-size:1.2rem}.wb2{position:absolute;top:2px;right:2px}
.sets{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.sb{width:36px;height:36px;min-height:0;min-width:0;padding:0;border-radius:50%;font-weight:700}.sb.on{background:var(--acc);color:var(--on);border-color:var(--acc);animation:bowp .4s}
.xr details summary{cursor:pointer;color:var(--acc);font-size:.85rem}.xr details p{margin:6px 0;font-size:.85rem;color:var(--mut)}
.ban{background:var(--hl);padding:10px 12px;border-radius:14px;margin:12px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;animation:pulse2 1.6s infinite}@keyframes pulse2{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 20%,transparent)}}
.wtr{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}.restc{text-align:center;padding:8px}.safe{border-color:var(--acc)}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.stg b{display:block;font-size:1.5rem;color:var(--acc)}.stg small{color:var(--mut)}
.hist{display:flex;gap:3px;align-items:flex-end;height:96px;padding-top:16px}.hb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:.6rem;color:var(--mut);position:relative}.hb i{display:block;width:70%;border-radius:6px 6px 2px 2px;background:var(--acc);opacity:.4;animation:grow .7s both}.hb.ok i{opacity:1}.hbw{position:absolute;top:-16px}
.wtrack{position:relative;padding-top:28px}.wlk{position:absolute;top:0;transform:translateX(-50%);font-size:22px;animation:wlk .5s ease-in-out infinite alternate}@keyframes wlk{to{transform:translateX(-50%) translateY(-4px) rotate(6deg)}}
@media(max-width:720px){.fb{width:104px}.lg{height:60px}.lg img{height:52px}}

 else if(g.ph=='rest'){h+=`<h1 class="sh-h">Rest</h1><div class="tm" id="gtm">${Math.ceil(Math.max(0,g.end-Date.now())/1000)}</div><p class="mut">Next: set ${g.set+1} of ${e.s}, ${esc(e.n)}</p><button class="p" onclick="gSkipRest()">Skip rest</button>`}
 else{const timed=e.u!=='reps',tot=timed?gdur(e):0,x=xi(e.n);h+=`<div class="exa-big">${exAnim(e.n)}</div><h1 class="sh-h">${esc(e.n)}</h1><p class="mut">${e.u=='secs'?'Set '+(g.set+1)+' of '+e.s+', '+e.r+' seconds':timed?(e.u=='sec'?e.r+' seconds':e.r+' minutes'):'Set '+(g.set+1)+' of '+e.s+', '+e.r+' repetitions'+(e.x||'')}</p>`;
  if(timed){const left=g.run?Math.max(0,Math.ceil((g.end-Date.now())/1000)):(g.left||tot);h+=`<div class="tm" id="gtm">${Math.floor(left/60)}:${pad(left%60)}</div><div class="row" style="justify-content:center"><button class="p" onclick="gTimed()">${g.run?'Pause':(g.left&&g.left<tot?'Resume':'Start')}</button><button onclick="gEnd()">Skip</button></div>`}
  else h+=`<div class="tm">${g.reps}</div><p class="mut">of ${e.r}</p><div class="row" style="justify-content:center"><button class="p gbig" onclick="G.reps++;gr();if(S.vib!==false)buzz()">+1 rep</button><button onclick="G.reps=Math.max(0,G.reps-1);gr()">-1</button></div><div class="row" style="justify-content:center;margin-top:12px"><button onclick="gSetDone()">Set done</button></div>`;
  h+=`<details open><summary>How to, easier option</summary><p class="mut">${x[0]}</p><p class="mut"><b>Easier:</b> ${x[1]}</p></details>`}
 $('#guide').innerHTML=h+'</div>'}
function gtick(){const g=G;if(!g||g.fin)return;const t=$('#gtm');if(g.ph=='rest'){const r=Math.max(0,g.end-Date.now());if(t)t.textContent=Math.ceil(r/1000);if(r<=0){if(S.snd!==false)chime();if(S.vib!==false)buzz();g.ph='work';gr()}}
 else if(g.run){const r=Math.max(0,Math.ceil((g.end-Date.now())/1000));if(t)t.textContent=Math.floor(r/60)+':'+pad(r%60);if(r<=0){if(S.snd!==false)chime();if(S.vib!==false)buzz();gEnd()}}}
function gTimed(){const g=G,e=g.L[g.i];if(g.run){g.left=Math.max(1,Math.ceil((g.end-Date.now())/1000));g.run=false}else{g.left=g.left||gdur(e);g.end=Date.now()+g.left*1000;g.run=true}gr()}
function gEnd(){const e=G.L[G.i];e.u=='secs'?gSetDone():gNext()}
function gSetDone(){const g=G,e=g.L[g.i];g.set++;g.reps=0;g.run=false;g.left=0;if(S.snd!==false)chime();if(g.set>=e.s)gNext();else{g.ph='rest';g.end=Date.now()+(S.rst||45)*1000;gr()}}
function gSkipRest(){G.ph='work';gr()}
function gNext(){const g=G;g.i++;g.set=0;g.reps=0;g.ph='work';g.run=false;g.left=0;if(g.i>=g.L.length){g.fin=true;g.i=g.L.length-1;if(g.m=='w')finishW(g.k)}gr()}
function finishW(k){const pl=pOf(k);S.wd[k]=1;S.ex[k]=pl.ex.map((_,i)=>i);S.sets[k]={};pl.ex.forEach((e,i)=>S.sets[k][i]=e.u=='min'?0:+e.s);chkAll(k);save()}
function fbOpen(){G={m:'w',k:FK||key(),L:[{n:'',s:1,r:1,u:'reps'}],i:0,fin:true,pain:false,ph:'fb'};$('#guide').classList.add('open');clearInterval(GT);gr()}
function gFb(v){S.fb[G.k]=v;save();if(v=='pain'){G.pain=true;gr()}else gclose(1)}
function gclose(done){clearInterval(GT);G=null;$('#guide').classList.remove('open');if(done)FX='#plancard';render()}

 if(OB==0)h+=`<span class="lt">STEP 1 OF 3</span><h1 class="sh-h">What should Lisa call you?</h1><label class="mut" style="display:block;text-align:left">Name<input id="ob1" maxlength="24" value="${esc(S.name&&S.name!='Lisa'?S.name:'')}" placeholder="Your name"></label><label class="mut" style="display:block;text-align:left;margin-top:12px">Age (optional)<input id="ob2" type="number" min="5" max="100" value="${(S.pf&&S.pf.age)||''}" placeholder="e.g. 16"></label><h2 class="sh2">Theme</h2><div class="row" style="justify-content:center;gap:12px">${Object.keys(TN).map(k=>`<button class="dot ${S.theme==k?'on':''}" aria-label="${TN[k][0]}" style="background:${TN[k][1]}" onclick="S.theme='${k}';theme();onbR()"></button>`).join('')}</div>`;
 else if(OB==1)h+=`<span class="lt">STEP 2 OF 3</span><h1 class="sh-h">Your sleep window</h1><p class="mut">Teens generally need 8 to 10 hours. Lisa uses this for the sleep card and for when the buddy naps.</p><div class="row" style="justify-content:center"><label class="mut">Bedtime<input id="ob3" type="time" value="${tvs(S.bed)}"></label><label class="mut">Wake up<input id="ob4" type="time" value="${tvs(S.wake)}"></label></div>`;
 else h+=`<span class="lt">STEP 3 OF 3</span><h1 class="sh-h">Health details are optional</h1><p class="mut">Weight, height and health notes can personalise Lisa, but only if you want. Nothing is asked now. You can add them later in Settings, My profile, and delete them any time.</p>`;
 $('#onb').innerHTML=h+`<div class="row" style="justify-content:center;margin-top:20px">${OB>0?'<button onclick="OB--;onbR()">Back</button>':''}<button class="p" onclick="onbNext()">${OB==2?'Finish':'Next'}</button></div></div>`}
function onbNext(){if(OB==0){const n=$('#ob1').value.trim(),a=+$('#ob2').value;if(n)S.name=n.slice(0,24);if(a>=5&&a<=100)(S.pf=S.pf||{}).age=a}else if(OB==1){S.bed=tmn($('#ob3').value);S.wake=tmn($('#ob4').value)}
 if(OB<2){OB++;onbR();return}S.onb=true;save();$('#onb').classList.remove('open');render()}

 march:{h:['60,14','60,13'],L:[['t','60,22 60,44','60,22 60,44'],['a','60,26 52,36 46,46','60,26 68,36 74,46'],['a','60,26 68,36 74,46','60,26 52,36 46,46'],['l','60,44 62,58 60,72','60,44 72,50 70,64'],['l','60,44 60,58 58,72','60,44 72,50 70,64','d']],p:''},

function exAnim(n){const l=String(n).toLowerCase(),k=/squat/.test(l)?'squat':/push/.test(l)?'push':/bridge/.test(l)?'bridge':/bird/.test(l)?'bird':/leg raise/.test(l)?'leg':/plank/.test(l)?'plank':/stretch|cool/.test(l)?'stretch':'march',P=PS[k],d=k=='march'?1.2:2.8,
 an=(at,a,b,ph)=>`<animate attributeName="${at}" dur="${d}s" repeatCount="indefinite" values="${a};${b};${a}" keyTimes="0;.5;1" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"${ph?` begin="-${d/2}s"`:''}/>`,
 lines=P.L.map(x=>`<polyline points="${x[1]}" class="${x[0]=='a'?'ea':x[0]=='l'?'el':'et'}">${an('points',x[1],x[2],x[3])}</polyline>`).join(''),h0=P.h[0].split(','),h1=P.h[1].split(',');
 return`<svg class="exa" viewBox="0 0 120 80" role="img" aria-label="${esc(n)} animation"><line x1="6" y1="72" x2="114" y2="72" class="eg"/>${P.p}${lines}<circle r="6.5" class="eh" cx="${h0[0]}" cy="${h0[1]}">${an('cx',h0[0],h1[0])}${an('cy',h0[1],h1[1])}</circle></svg>`}
function parseEx(l){l=l.trim();let x='',m=l.match(/\s+(per side|each side)\s*$/i);if(m){x=' per side';l=l.slice(0,m.index)}
 m=l.match(/^(.*?)[\s:–-]*(\d+)\s*[x×]\s*(\d+(?:[–-]\d+)?)\s*(?:s|sec|secs|seconds)$/i);if(m)return E(m[1].trim().slice(0,40)||l.slice(0,40),Math.min(+m[2],8),m[3],'secs',x);
 m=l.match(/^(.*?)[\s:–-]*(\d+)\s*[x×]\s*(\d+(?:[–-]\d+)?)$/i);if(m)return E(m[1].trim().slice(0,40)||l.slice(0,40),Math.min(+m[2],8),m[3],'reps',x);
 m=l.match(/^(.*?)[\s:–-]*(\d+(?:[–-]\d+)?)\s*min(?:utes?)?$/i);if(m)return E(m[1].trim().slice(0,40)||l.slice(0,40),1,m[2],'min');return E(l.slice(0,40),2,8)}
const rulesCard=()=>`<div class="card"><h2>Plan rules</h2><ul class="mnote"><li>For the first 2 weeks, work out at your own capacity.</li><li>Rest 30 to 60 seconds between sets.</li><li>Jumping and intense exercises are not needed.</li><li>Stop if you feel knee pain, dizziness or unusual breathlessness.</li><li>Do not crash diet for weight loss.</li><li>Keep following your doctor's advice and follow-ups for PCOD or PCOS.</li></ul><p class="mut">Aim: a little more consistency every week, more strength, and a gradual rise in activity.</p></div>`;

 <div class="card"><div class="wkS">${wk.map(x=>{const dd=new Date(x+'T00:00');return`<button class="wsd${x==k?' on':''}${x==tk?' tdy':''}" onclick="MK='${x}';render()" aria-label="${dd.toDateString()}, ${eat(x)} of ${MS.length} meals"><small>${dd.toLocaleDateString([],{weekday:'short'})}</small><b>${dd.getDate()}</b><span class="mdots">${MS.map(m=>`<i class="${(S.me[x]||{})[m[0]]?'on':''}"></i>`).join('')}</span></button>`}).join('')}</div></div>
 ${MS.map(m=>{const a=TT(k).find(x=>m[2].includes(x.t)),done=!!(S.me[k]||{})[m[0]];return`<div class="it mr ${done?'done':''}" id="mr_${m[0]}"><input type="checkbox" ${done?'checked':''} onchange="meTog('${k}','${m[0]}')" aria-label="${m[1]} done"><div class="tb"><small class="mut">${m[1]}${a?' · '+fmt(a.s)+(a.e!=null?' to '+fmt(a.e):''):''}</small><div><b>${esc(mTxt(k,m))}</b>${done?BOWI:''}</div></div><div class="ac"><button class="ib" onclick="meSwap('${k}','${m[0]}')" aria-label="Suggest another ${m[1]}">${ic('<path d="M7 7h11l-3-3M17 17H6l3 3"/>')}</button><button class="ib" onclick="meEdit('${k}','${m[0]}')" aria-label="Edit ${m[1]}">${ICN.ed}</button></div></div>`}).join('')}
 <div class="card"><h2>Plate guide for lunch and dinner</h2><div class="row" style="flex-wrap:nowrap;gap:16px"><svg class="plate" viewBox="0 0 160 160" role="img" aria-label="Half vegetables, a quarter protein, a quarter whole grains"><path d="M10 80A70 70 0 0 1 150 80L80 80Z" fill="var(--acc)"/><path d="M80 80L80 150A70 70 0 0 1 10 80Z" fill="var(--hl)" stroke="var(--ln)"/><path d="M80 80L150 80A70 70 0 0 1 80 150Z" fill="var(--card)" stroke="var(--ln)"/><g font-size="11" font-weight="700" text-anchor="middle"><text x="80" y="52" fill="var(--on)">Vegetables</text><text x="46" y="118" fill="var(--ink)">Protein</text><text x="114" y="118" fill="var(--ink)">Grains</text></g></svg><div class="mut" style="font-size:.9rem"><p style="margin:0 0 6px">Half vegetables or salad.</p><p style="margin:0 0 6px">A quarter protein: dal, paneer, tofu, sprouts, curd, rajma or chole.</p><p style="margin:0">A quarter whole grains: roti, millets, brown rice or daliya.</p></div></div></div>
 <div class="card"><h2>Notes for PCOD or PCOS</h2><ul class="mnote"><li>Put some protein in every meal.</li><li>Choose whole grains and millets more often than refined flour.</li><li>Add vegetables or salad to lunch and dinner.</li><li>Limit sugary drinks, packaged snacks and fried food.</li><li>Eat at regular times and sip water through the day.</li><li>Growing teens need enough food. Do not skip meals to lose weight.</li></ul><p class="mut">These are general food ideas, not a diet plan or medical advice. Swap anything you are allergic to or do not eat. A doctor or registered dietitian can build a plan for you.</p></div>`}
